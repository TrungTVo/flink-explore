<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flink Watermark & Idle Timeout Visualizer</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  @keyframes pulse-soft { 0%,100% { opacity: 1; } 50% { opacity: .6; } }
  .animate-pulse-soft { animation: pulse-soft 1.6s ease-in-out infinite; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// Inline SVG icon components (replacing lucide-react)
const Icon = ({ children, size = 18, className = "" }) => (
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width={size}
    height={size}
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    strokeWidth="2"
    strokeLinecap="round"
    strokeLinejoin="round"
    className={className}
  >
    {children}
  </svg>
);

const Play = (props) => (
  <Icon {...props}><polygon points="6 3 20 12 6 21 6 3"></polygon></Icon>
);
const Pause = (props) => (
  <Icon {...props}><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></Icon>
);
const RotateCcw = (props) => (
  <Icon {...props}><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></Icon>
);
const AlertTriangle = (props) => (
  <Icon {...props}><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></Icon>
);
const Clock = (props) => (
  <Icon {...props}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></Icon>
);
const Zap = (props) => (
  <Icon {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></Icon>
);

const App = () => {
  // Configuration
  const [watermarkDelay, setWatermarkDelay] = useState(5);
  const [idleTimeout, setIdleTimeout] = useState(10);
  const [isP1Active, setIsP1Active] = useState(true);

  // Stream state
  const [p0Time, setP0Time] = useState(0);
  const [p1Time, setP1Time] = useState(0);
  const [p1LastEventWallClock, setP1LastEventWallClock] = useState(Date.now());
  const [isRunning, setIsRunning] = useState(false);
  const [isP1MarkedIdle, setIsP1MarkedIdle] = useState(false);

  // Tick to refresh the "Timing out" progress bar smoothly
  const [, setTick] = useState(0);

  // Derived watermarks
  const p0Watermark = Math.max(0, p0Time - watermarkDelay);
  const p1Watermark = Math.max(0, p1Time - watermarkDelay);
  const combinedWatermark = isP1MarkedIdle ? p0Watermark : Math.min(p0Watermark, p1Watermark);

  // Simulation loop
  useEffect(() => {
    if (!isRunning) return;
    const interval = setInterval(() => {
      setP0Time(prev => prev + 0.5);
      if (isP1Active) {
        setP1Time(prev => prev + 0.5);
        setP1LastEventWallClock(Date.now());
        setIsP1MarkedIdle(false);
      } else {
        const secondsSinceLastEvent = (Date.now() - p1LastEventWallClock) / 1000;
        if (secondsSinceLastEvent >= idleTimeout) {
          setIsP1MarkedIdle(true);
        }
      }
    }, 500);
    return () => clearInterval(interval);
  }, [isRunning, isP1Active, p1LastEventWallClock, idleTimeout]);

  // Lightweight ticker so the idle-timeout progress bar updates between sim ticks
  useEffect(() => {
    if (!isRunning || isP1Active || isP1MarkedIdle) return;
    const t = setInterval(() => setTick(n => n + 1), 100);
    return () => clearInterval(t);
  }, [isRunning, isP1Active, isP1MarkedIdle]);

  const resetSimulation = () => {
    setP0Time(0);
    setP1Time(0);
    setIsP1MarkedIdle(false);
    setP1LastEventWallClock(Date.now());
    setIsRunning(false);
  };

  return (
    <div className="flex flex-col min-h-screen bg-slate-50 text-slate-900 p-4">
      {/* Header */}
      <div className="mb-6">
        <h1 className="text-2xl font-bold text-indigo-700">Flink Watermark & Idle Timeout Visualizer</h1>
        <p className="text-slate-600">See how idle partitions stall the pipeline and how the Idle Timeout fixes it.</p>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 flex-grow">
        {/* Controls Column */}
        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col gap-6">
          <div>
            <h2 className="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-4">Simulation Controls</h2>
            <div className="flex gap-2 mb-4">
              <button
                onClick={() => setIsRunning(!isRunning)}
                className={`flex-1 flex items-center justify-center gap-2 py-2 rounded-lg font-medium transition ${isRunning ? 'bg-amber-100 text-amber-700' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}
              >
                {isRunning ? <><Pause size={18}/> Stop</> : <><Play size={18}/> Start</>}
              </button>
              <button
                onClick={resetSimulation}
                className="p-2 bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200"
              >
                <RotateCcw size={18}/>
              </button>
            </div>

            <button
              onClick={() => setIsP1Active(!isP1Active)}
              className={`w-full py-3 rounded-lg font-bold border-2 transition ${isP1Active ? 'border-green-500 text-green-600 bg-green-50' : 'border-red-500 text-red-600 bg-red-50'}`}
            >
              {isP1Active ? "Partition 1: ACTIVE" : "Partition 1: IDLE / STOPPED"}
            </button>
          </div>

          <div className="space-y-4">
            <h2 className="text-sm font-semibold uppercase tracking-wider text-slate-400">Tuning Parameters</h2>

            <div>
              <label className="flex justify-between text-sm mb-1">
                <span>Watermark Delay</span>
                <span className="font-mono bg-slate-100 px-1 rounded">{watermarkDelay}s</span>
              </label>
              <input
                type="range" min="0" max="20" value={watermarkDelay}
                onChange={(e) => setWatermarkDelay(Number(e.target.value))}
                className="w-full accent-indigo-600"
              />
            </div>

            <div>
              <label className="flex justify-between text-sm mb-1">
                <span>Idle Timeout</span>
                <span className="font-mono bg-slate-100 px-1 rounded">{idleTimeout}s</span>
              </label>
              <input
                type="range" min="1" max="30" value={idleTimeout}
                onChange={(e) => setIdleTimeout(Number(e.target.value))}
                className="w-full accent-indigo-600"
              />
              <p className="text-[11px] text-slate-500 mt-1 italic">
                How long Flink waits before ignoring Partition 1's lagging watermark.
              </p>
            </div>
          </div>

          {!isP1Active && !isP1MarkedIdle && (() => {
            const elapsed = (Date.now() - p1LastEventWallClock) / 1000;
            const remaining = Math.max(0, idleTimeout - elapsed);
            const progress = Math.min(100, (elapsed / idleTimeout) * 100);
            return (
              <div className="mt-auto p-4 bg-amber-50 border border-amber-200 rounded-lg animate-pulse-soft">
                <div className="flex items-center justify-between gap-2 text-amber-700 font-semibold text-sm">
                  <div className="flex items-center gap-2">
                    <Clock size={16}/> Timing out P1...
                  </div>
                  <span className="font-mono text-amber-800 bg-amber-100 px-2 py-0.5 rounded">
                    {remaining.toFixed(1)}s / {idleTimeout}s
                  </span>
                </div>
                <div className="w-full bg-amber-200 h-1.5 mt-2 rounded-full overflow-hidden">
                  <div
                    className="bg-amber-600 h-full transition-all duration-200"
                    style={{ width: `${progress}%` }}
                  ></div>
                </div>
              </div>
            );
          })()}
        </div>

        {/* Visualization Column */}
        <div className="lg:col-span-2 space-y-4">
          {/* Stream P0 */}
          <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 relative overflow-hidden">
            <div className="absolute top-0 right-0 p-2 text-[10px] font-mono text-slate-300">PARTITION 0</div>
            <div className="flex items-center gap-4 mb-4">
              <div className="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-blue-600">
                <Zap size={24} />
              </div>
              <div>
                <h3 className="font-bold">Active Partition (P0)</h3>
                <div className="text-xs text-slate-500">Events: t = {p0Time.toFixed(1)}s</div>
              </div>
            </div>

            <div className="relative h-12 bg-slate-100 rounded-lg border-x-2 border-slate-300 mt-8">
              <div
                className="absolute top-0 bottom-0 border-l-2 border-blue-500 z-10 transition-all duration-500"
                style={{ left: `${Math.min(100, (p0Watermark / 60) * 100)}%` }}
              >
                <span className="absolute -top-6 left-0 text-[10px] font-bold text-blue-600 whitespace-nowrap bg-white px-1 border border-blue-200 rounded">WM: {p0Watermark.toFixed(1)}</span>
              </div>
              <div
                className="absolute top-0 bottom-0 bg-blue-400 opacity-20 transition-all duration-500"
                style={{ width: `${Math.min(100, (p0Time / 60) * 100)}%` }}
              ></div>
            </div>
          </div>

          {/* Stream P1 */}
          <div className={`bg-white p-6 rounded-xl shadow-sm border transition-all duration-500 relative overflow-hidden ${isP1MarkedIdle ? 'border-slate-200 opacity-60 grayscale' : 'border-slate-200'}`}>
            <div className="absolute top-0 right-0 p-2 text-[10px] font-mono text-slate-300">PARTITION 1</div>
            <div className="flex items-center gap-4 mb-4">
              <div className={`w-12 h-12 rounded-full flex items-center justify-center transition-colors ${isP1Active ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}`}>
                {isP1Active ? <Zap size={24} /> : <AlertTriangle size={24} />}
              </div>
              <div>
                <h3 className="font-bold">Lagging Partition (P1)</h3>
                <div className="text-xs text-slate-500">
                  Events: t = {p1Time.toFixed(1)}s
                  {isP1MarkedIdle && <span className="ml-2 text-red-500 font-bold uppercase tracking-tighter">[Marked Idle]</span>}
                </div>
              </div>
            </div>

            <div className="relative h-12 bg-slate-100 rounded-lg border-x-2 border-slate-300 mt-8">
              <div
                className="absolute top-0 bottom-0 border-l-2 border-green-500 z-10 transition-all duration-500"
                style={{ left: `${Math.min(100, (p1Watermark / 60) * 100)}%` }}
              >
                <span className="absolute -top-6 left-0 text-[10px] font-bold text-green-600 whitespace-nowrap bg-white px-1 border border-green-200 rounded">WM: {p1Watermark.toFixed(1)}</span>
              </div>
              <div
                className={`absolute top-0 bottom-0 opacity-20 transition-all duration-500 ${isP1Active ? 'bg-green-400' : 'bg-red-400'}`}
                style={{ width: `${Math.min(100, (p1Time / 60) * 100)}%` }}
              ></div>
            </div>
          </div>

          {/* Combined Watermark */}
          <div className="bg-indigo-900 p-8 rounded-xl shadow-xl text-white relative">
            <div className="flex flex-col items-center gap-4">
              <div className="text-indigo-200 text-sm font-semibold uppercase tracking-widest">Combined Pipeline Watermark</div>
              <div className="text-6xl font-black font-mono tracking-tighter transition-all duration-300">
                {combinedWatermark.toFixed(1)}s
              </div>

              {!isP1Active && !isP1MarkedIdle && isRunning && (
                <div className="flex items-center gap-2 px-4 py-2 bg-red-500/20 border border-red-500/50 rounded-full text-red-200 text-sm animate-pulse-soft">
                  <AlertTriangle size={16}/> SEIZING UP: Waiting for P1
                </div>
              )}

              {isP1MarkedIdle && (
                <div className="flex items-center gap-2 px-4 py-2 bg-green-500/20 border border-green-500/50 rounded-full text-green-200 text-sm">
                  <Zap size={16}/> RESUMED: P1 ignored by Timeout
                </div>
              )}
            </div>

            <div className="mt-8">
              <div className="flex justify-between text-[10px] text-indigo-300 mb-1">
                <span>Pipeline Progress</span>
                <span>60s Window Target</span>
              </div>
              <div className="h-4 bg-indigo-950 rounded-full border border-indigo-700/50 overflow-hidden relative">
                <div
                  className="h-full bg-gradient-to-r from-indigo-500 to-cyan-400 transition-all duration-700"
                  style={{ width: `${Math.min(100, (combinedWatermark / 60) * 100)}%` }}
                ></div>
              </div>
            </div>
          </div>

          {/* Explanation */}
          <div className="bg-white p-6 rounded-xl border border-indigo-100 shadow-sm">
            <h3 className="font-bold text-indigo-800 flex items-center gap-2 mb-2">
              <Clock size={18}/> What's happening?
            </h3>
            <ol className="text-sm space-y-3 text-slate-600 list-decimal list-inside">
              <li><strong>Independence:</strong> P0 and P1 produce their own watermarks (<code>Time - Delay</code>).</li>
              <li><strong>The Lag:</strong> When you stop P1, its watermark freezes. The combined watermark is <code>min(P0_WM, P1_WM)</code>, so it <strong>stops moving</strong> entirely.</li>
              <li><strong>The Timeout:</strong> Watch the timer on the left. Once it hits the <strong>Idle Timeout</strong>, Flink marks P1 as "Idle".</li>
              <li><strong>The Recovery:</strong> Flink now uses only P0's watermark. The pipeline "un-seizes" and continues to process data!</li>
            </ol>
          </div>
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
