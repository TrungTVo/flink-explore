<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flink Stream Visualizer — Watermark & Allowed Lateness</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

    @keyframes pop-in {
      0%   { opacity: 0; transform: scale(0.6) translateY(8px); }
      100% { opacity: 1; transform: scale(1)   translateY(0);   }
    }
    .pop-in { animation: pop-in 220ms cubic-bezier(0.22, 1, 0.36, 1); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    // --- Inline lucide icons ---------------------------------------------
    const ICONS = {
      activity: "M22 12h-4l-3 9L9 3l-3 9H2",
      zap:      "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
      rotateCcw:"M3 12a9 9 0 1 0 3-6.7L3 8 M3 3v5h5",
      archive:  "M21 8v13H3V8 M1 3h22v5H1z M10 12h4",
      history:  "M3 12a9 9 0 1 0 9-9 M3 3v5h5 M12 7v5l4 2",
    };
    const Icon = ({ name, size = 16, className = "", strokeWidth = 2 }) => (
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width={size} height={size}
        viewBox="0 0 24 24"
        fill="none" stroke="currentColor"
        strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
        className={className}
      >
        <path d={ICONS[name]} />
      </svg>
    );

    // --- App -------------------------------------------------------------
    const App = () => {
      const [outOfOrderness, setOutOfOrderness] = useState(3);
      const [allowedLateness, setAllowedLateness] = useState(5);
      const windowSize = 10;

      const [events, setEvents] = useState([]);
      const [droppedEvents, setDroppedEvents] = useState([]);
      const [maxTimestamp, setMaxTimestamp] = useState(0);
      const [logs, setLogs] = useState([]);
      const [processedWindows, setProcessedWindows] = useState(new Set());
      const [customTs, setCustomTs] = useState('');

      const scrollContainerRef = useRef(null);

      const watermark = Math.max(0, maxTimestamp - outOfOrderness);

      const addLog = (msg, type = 'info') => {
        setLogs(prev => [{
          id: Date.now() + Math.random(),
          msg, type,
          time: new Date().toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' })
        }, ...prev]);
      };

      const submitCustom = () => {
        const n = parseInt(customTs, 10);
        if (Number.isFinite(n) && n >= 0) {
          handleAddEvent(n);
          setCustomTs('');
        }
      };

      useEffect(() => {
        const currentWindowEnd = Math.floor(watermark / windowSize) * windowSize;
        for (let i = 0; i <= currentWindowEnd; i += windowSize) {
          const windowId = `${i}-${i + windowSize}`;
          if (watermark >= i + windowSize && !processedWindows.has(windowId)) {
            addLog(`Window [${i}s - ${i + windowSize}s] CLOSED for initial results.`, 'system');
            setProcessedWindows(prev => new Set(prev).add(windowId));
          }
        }
      }, [watermark, windowSize, processedWindows]);

      const handleAddEvent = (ts) => {
        const windowStart = Math.floor(ts / windowSize) * windowSize;
        const windowEnd = windowStart + windowSize;
        const deadline = windowEnd + allowedLateness;

        const eventOrder = events.length + droppedEvents.length + 1;
        const isDropped = watermark >= deadline;

        if (isDropped) {
          const droppedEvent = { id: Math.random(), timestamp: ts, order: eventOrder, type: 'dropped' };
          setDroppedEvents(prev => [droppedEvent, ...prev]);
          addLog(`Record #${eventOrder} @ ${ts}s DROPPED. Watermark ${watermark}s > Deadline ${deadline}s.`, 'error');
          return;
        }

        const isLate = watermark >= windowEnd;
        const newEvent = {
          id: Math.random(),
          timestamp: ts,
          order: eventOrder,
          type: isLate ? 'late' : 'included'
        };

        setEvents(prev => [...prev, newEvent]);

        if (ts > maxTimestamp) {
          setMaxTimestamp(ts);
        }

        if (isLate) {
          addLog(`Record #${eventOrder} @ ${ts}s processed as LATE update for [${windowStart}-${windowEnd}].`, 'warn');
        } else {
          addLog(`Record #${eventOrder} @ ${ts}s processed for [${windowStart}-${windowEnd}].`, 'success');
        }
      };

      const reset = () => {
        setEvents([]);
        setDroppedEvents([]);
        setMaxTimestamp(0);
        setLogs([]);
        setProcessedWindows(new Set());
      };

      const getEventStyle = (type) => {
        switch (type) {
          case 'included': return 'bg-emerald-500 text-white border-emerald-600';
          case 'late':     return 'bg-amber-500 text-white border-amber-600';
          case 'dropped':  return 'bg-rose-500 text-white border-rose-600';
          default:         return 'bg-slate-500 text-white';
        }
      };

      return (
        <div className="flex flex-col min-h-screen bg-[#f8fafc] text-slate-900 font-sans p-4 md:p-6">
          {/* Header */}
          <div className="max-w-[1600px] mx-auto w-full mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl font-black tracking-tight flex items-center gap-2">
                <Icon name="activity" size={28} className="text-blue-600" />
                FLINK STREAM VISUALIZER
              </h1>
              <p className="text-slate-500 text-sm font-medium">Event Time, Watermarks &amp; Windowing State</p>
            </div>

            <div className="flex items-center gap-3">
              <div className="bg-white px-4 py-2 rounded-xl shadow-sm border border-slate-200 flex items-center gap-4">
                <div className="flex flex-col">
                  <span className="text-[10px] font-bold text-slate-400 uppercase">Max Observed</span>
                  <span className="text-lg font-black leading-none">{maxTimestamp}s</span>
                </div>
                <div className="h-8 w-px bg-slate-100" />
                <div className="flex flex-col">
                  <span className="text-[10px] font-bold text-blue-500 uppercase">Watermark</span>
                  <span className="text-lg font-black leading-none text-blue-600">{watermark}s</span>
                </div>
              </div>
              <button onClick={reset} className="bg-slate-900 text-white p-3 rounded-xl hover:bg-slate-800 transition-colors shadow-lg shadow-slate-200">
                <Icon name="rotateCcw" size={20} />
              </button>
            </div>
          </div>

          <div className="max-w-[1600px] mx-auto w-full grid grid-cols-1 xl:grid-cols-4 gap-6">

            {/* Left: Controls + Calculation + Dropped */}
            <div className="xl:col-span-1 space-y-6">
              <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
                <h2 className="text-sm font-black uppercase tracking-wider text-slate-400 flex items-center gap-2">
                  <Icon name="zap" /> Strategy Config
                </h2>

                <div className="space-y-6">
                  <div className="space-y-3">
                    <div className="flex justify-between items-end">
                      <label className="text-xs font-bold text-slate-600 uppercase">Out-of-Orderness (t)</label>
                      <span className="text-xl font-black text-blue-600">{outOfOrderness}s</span>
                    </div>
                    <input
                      type="range" min="0" max="10" step="1"
                      value={outOfOrderness}
                      onChange={(e) => setOutOfOrderness(parseInt(e.target.value))}
                      className="w-full h-2 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-blue-600"
                    />
                  </div>

                  <div className="space-y-3">
                    <div className="flex justify-between items-end">
                      <label className="text-xs font-bold text-slate-600 uppercase">Allowed Lateness</label>
                      <span className="text-xl font-black text-amber-600">{allowedLateness}s</span>
                    </div>
                    <input
                      type="range" min="0" max="15" step="1"
                      value={allowedLateness}
                      onChange={(e) => setAllowedLateness(parseInt(e.target.value))}
                      className="w-full h-2 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-amber-500"
                    />
                  </div>
                </div>

                <div className="pt-4 border-t border-slate-50">
                  <h3 className="text-xs font-bold text-slate-400 uppercase mb-3">Ingest Records</h3>
                  <div className="grid grid-cols-4 gap-2">
                    {[0, 2, 5, 8, 11, 14, 19, 25].map(t => (
                      <button
                        key={t}
                        onClick={() => handleAddEvent(t)}
                        className="bg-slate-50 hover:bg-blue-600 hover:text-white transition-all py-3 rounded-xl text-sm font-bold border border-slate-100"
                      >
                        {t}s
                      </button>
                    ))}
                  </div>

                  <div className="mt-3 flex gap-2">
                    <input
                      type="number"
                      min="0"
                      placeholder="custom event time"
                      value={customTs}
                      onChange={(e) => setCustomTs(e.target.value)}
                      onKeyDown={(e) => { if (e.key === 'Enter') submitCustom(); }}
                      className="flex-1 min-w-0 px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-sm font-bold focus:outline-none focus:border-blue-500 focus:bg-white"
                    />
                    <button
                      onClick={submitCustom}
                      className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition-colors shrink-0"
                    >
                      Add
                    </button>
                  </div>
                </div>
              </div>

              {/* Watermark Calculation Panel */}
              <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 className="text-sm font-black uppercase tracking-wider text-blue-500 flex items-center gap-2 mb-4">
                  <Icon name="activity" /> Watermark Calculation
                </h2>
                <div className="font-mono text-xs space-y-1 bg-slate-50 rounded-lg p-4 border border-slate-100">
                  <div className="flex justify-between">
                    <span className="text-slate-500">Max Observed Timestamp</span>
                    <span className="font-black text-slate-800">{String(maxTimestamp).padStart(3, ' ')}s</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-500">Out-of-Orderness Bound</span>
                    <span className="font-black text-slate-800">−{String(outOfOrderness).padStart(2, ' ')}s</span>
                  </div>
                  <div className="border-t border-slate-300 my-1.5" />
                  <div className="flex justify-between">
                    <span className="text-blue-600 font-bold">Current Watermark</span>
                    <span className="font-black text-blue-600">{String(watermark).padStart(3, ' ')}s</span>
                  </div>
                </div>
                <p className="text-[11px] text-slate-500 italic mt-3 leading-relaxed">
                  Flink emits <span className="font-mono not-italic">watermark = max(eventTime) − outOfOrderness</span>,
                  signalling no event with t ≤ watermark will arrive.
                </p>
              </div>

              {/* Dropped Queue */}
              <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 className="text-sm font-black uppercase tracking-wider text-rose-500 flex items-center gap-2 mb-4">
                  <Icon name="archive" /> Dropped Records (Late)
                </h2>
                <div className="flex flex-wrap gap-2 max-h-48 overflow-y-auto custom-scrollbar">
                  {droppedEvents.length === 0 && <p className="text-xs text-slate-400 italic">No dropped records...</p>}
                  {droppedEvents.map(e => (
                    <div key={e.id} className="bg-rose-50 border border-rose-100 px-3 py-2 rounded-lg flex flex-col items-center min-w-[50px]">
                      <span className="text-[10px] font-bold text-rose-400">#{e.order}</span>
                      <span className="text-sm font-black text-rose-600">{e.timestamp}s</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* Center: Horizontal Windows */}
            <div className="xl:col-span-3 space-y-6">
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                <div className="p-6 border-b border-slate-50 flex justify-between items-center bg-slate-50/50">
                  <h2 className="text-sm font-black uppercase tracking-wider text-slate-600 flex items-center gap-2">
                    <Icon name="history" /> Window Execution Timeline
                  </h2>
                  <div className="flex gap-4 text-[10px] font-bold uppercase">
                    <span className="flex items-center gap-1.5"><div className="w-2 h-2 rounded-full bg-emerald-500" /> Included</span>
                    <span className="flex items-center gap-1.5"><div className="w-2 h-2 rounded-full bg-amber-500" /> Late Update</span>
                    <span className="flex items-center gap-1.5"><div className="w-2 h-2 rounded-full bg-rose-500" /> Dropped</span>
                  </div>
                </div>

                <div
                  ref={scrollContainerRef}
                  className="p-8 overflow-x-auto flex gap-8 items-start min-h-[400px] bg-white scroll-smooth custom-scrollbar"
                >
                  {[0, 10, 20, 30, 40].map(start => {
                    const end = start + windowSize;
                    const deadline = end + allowedLateness;
                    const isClosed = watermark >= end;
                    const isExpired = watermark >= deadline;

                    const windowEvents = events.filter(e => e.timestamp >= start && e.timestamp < end);

                    const eventsByTs = {};
                    windowEvents.forEach(e => {
                      if (!eventsByTs[e.timestamp]) eventsByTs[e.timestamp] = [];
                      eventsByTs[e.timestamp].push(e);
                    });

                    return (
                      <div key={start} className="flex-shrink-0 w-80 relative">
                        <div className="flex justify-between items-end mb-3">
                          <div className="flex flex-col">
                            <span className="text-[10px] font-black text-slate-400 uppercase leading-none mb-1">Window Range</span>
                            <span className="text-sm font-black text-slate-800">{start}s — {end}s</span>
                          </div>
                          <div className={`text-[9px] px-2 py-0.5 rounded font-bold uppercase ${
                            isExpired ? 'bg-slate-100 text-slate-400' :
                            isClosed ? 'bg-amber-100 text-amber-600' : 'bg-emerald-100 text-emerald-600'
                          }`}>
                            {isExpired ? 'State Expired' : isClosed ? 'Late-Allowed' : 'Active'}
                          </div>
                        </div>

                        <div className={`relative h-64 rounded-2xl border-2 transition-all duration-300 ${
                          isExpired ? 'bg-slate-50 border-slate-100 opacity-60' :
                          isClosed ? 'bg-amber-50/30 border-amber-100 shadow-inner' : 'bg-emerald-50/20 border-emerald-100'
                        }`}>
                          <div className="absolute bottom-2 left-0 right-0 flex justify-between px-2 text-[8px] font-bold text-slate-300">
                            <span>{start}s</span>
                            <span>{start + 5}s</span>
                            <span>{end}s</span>
                          </div>

                          {watermark >= start && watermark <= end + 5 && (
                            <div
                              className="absolute top-0 bottom-0 w-0.5 bg-blue-600 z-30 transition-all duration-500 shadow-[0_0_10px_rgba(37,99,235,0.3)]"
                              style={{ left: `${((watermark - start) / windowSize) * 100}%` }}
                            >
                              <div className="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-blue-600 text-white text-[8px] px-1.5 py-0.5 rounded-full font-black">
                                WM
                              </div>
                            </div>
                          )}

                          <div className="absolute inset-0 p-4 flex items-end">
                            <div className="relative w-full h-full">
                              {Object.entries(eventsByTs).map(([ts, tsEvents]) => (
                                <div
                                  key={ts}
                                  className="absolute bottom-0 flex flex-col-reverse gap-1 items-center"
                                  style={{ left: `${((parseFloat(ts) - start) / windowSize) * 100}%`, transform: 'translateX(-50%)' }}
                                >
                                  {tsEvents.map((e) => (
                                    <div
                                      key={e.id}
                                      className={`pop-in w-10 h-10 rounded-xl border-2 shadow-sm flex flex-col items-center justify-center ${getEventStyle(e.type)}`}
                                    >
                                      <span className="text-[10px] font-black">{e.timestamp}s</span>
                                      <span className="text-[7px] font-bold opacity-80 uppercase leading-none">#{e.order}</span>
                                    </div>
                                  ))}
                                  <div className="w-px h-2 bg-slate-200 mt-1" />
                                  <span className="text-[8px] font-bold text-slate-400 mt-0.5">{ts}s</span>
                                </div>
                              ))}
                            </div>
                          </div>
                        </div>

                        {!isExpired && isClosed && (
                          <div className="mt-2 h-1 w-full bg-slate-100 rounded-full overflow-hidden">
                            <div
                              className="h-full bg-amber-400 transition-all duration-500"
                              style={{ width: `${Math.min(100, ((watermark - end) / allowedLateness) * 100)}%` }}
                            />
                          </div>
                        )}
                      </div>
                    );
                  })}
                  <div className="flex-shrink-0 w-20" />
                </div>
              </div>

              {/* Window State Transition Explainer */}
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 className="text-sm font-black uppercase tracking-wider text-slate-600 flex items-center gap-2 mb-4">
                  <Icon name="history" /> Window State Transitions
                </h2>
                <div className="space-y-3">
                  <div className="flex items-start gap-4 p-3 rounded-xl bg-emerald-50/40 border border-emerald-100">
                    <span className="text-[10px] px-2 py-1 rounded font-bold uppercase bg-emerald-100 text-emerald-700 shrink-0 mt-0.5">Active</span>
                    <div className="flex-1 text-xs text-slate-700">
                      <div className="font-mono text-[11px] text-slate-500 mb-1">watermark &lt; windowEnd</div>
                      Window is open. New events for this range are aggregated normally and the result has not yet fired.
                    </div>
                  </div>
                  <div className="flex items-start gap-4 p-3 rounded-xl bg-amber-50/40 border border-amber-100">
                    <span className="text-[10px] px-2 py-1 rounded font-bold uppercase bg-amber-100 text-amber-700 shrink-0 mt-0.5">Late-Allowed</span>
                    <div className="flex-1 text-xs text-slate-700">
                      <div className="font-mono text-[11px] text-slate-500 mb-1">windowEnd ≤ watermark &lt; windowEnd + allowedLateness</div>
                      Window has fired its initial result. Further events for this range trigger <em>late updates</em> that re-fire the window. The amber progress bar shows how much of the lateness budget has been consumed.
                    </div>
                  </div>
                  <div className="flex items-start gap-4 p-3 rounded-xl bg-slate-50 border border-slate-200">
                    <span className="text-[10px] px-2 py-1 rounded font-bold uppercase bg-slate-200 text-slate-600 shrink-0 mt-0.5">State Expired</span>
                    <div className="flex-1 text-xs text-slate-700">
                      <div className="font-mono text-[11px] text-slate-500 mb-1">watermark ≥ windowEnd + allowedLateness</div>
                      Lateness budget is exhausted; window state is dropped. Any further event for this range is rejected and routed to the <span className="text-rose-600 font-bold">Dropped Records</span> queue.
                    </div>
                  </div>
                </div>
              </div>

              {/* System Logs */}
              <div className="bg-slate-900 rounded-2xl shadow-xl overflow-hidden border border-slate-800">
                <div className="px-6 py-3 border-b border-slate-800 bg-slate-800/50 flex items-center justify-between">
                  <span className="text-[10px] font-black text-slate-400 uppercase flex items-center gap-2">
                    <div className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                    Live Execution Logs
                  </span>
                  <span className="text-[10px] font-mono text-slate-500">v1.2.0-stable</span>
                </div>
                <div className="p-6 h-64 overflow-y-auto font-mono text-xs space-y-1.5 custom-scrollbar">
                  {logs.length === 0 && <p className="text-slate-700 italic">Listening for stream events...</p>}
                  {logs.map(log => (
                    <div key={log.id} className="flex gap-4 group">
                      <span className="text-slate-600 shrink-0 font-bold">{log.time}</span>
                      <span className={
                        log.type === 'error'  ? 'text-rose-400'   :
                        log.type === 'warn'   ? 'text-amber-400'  :
                        log.type === 'system' ? 'text-blue-400 italic' :
                                                'text-emerald-400'
                      }>
                        <span className="opacity-50 mr-2">{log.type === 'system' ? '⚙' : '>'}</span>
                        {log.msg}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
