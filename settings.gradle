rootProject.name = 'quickstart'

// Include subprojects (their logical Gradle paths)
include(":common")
include(":stream-files-connector")
include(":word-count")
include(":reduce")
include(":branch-streams")
include(":processFunction")
include(":keyedProcessFunction")
include(":keyedProcessFunction_2")
include(":processAllWindowFunction")
include(":aggregate")
include(":inactivity-alert")

// Point each project to its physical directory under flink-jobs/
project(":common").projectDir = file("flink-jobs/common")
project(":stream-files-connector").projectDir = file("flink-jobs/stream-files-connector")
project(":word-count").projectDir = file("flink-jobs/word-count")
project(":reduce").projectDir = file("flink-jobs/reduce")
project(":branch-streams").projectDir = file("flink-jobs/branch-streams")
project(":processFunction").projectDir = file("flink-jobs/processFunction")
project(":keyedProcessFunction").projectDir = file("flink-jobs/keyedProcessFunction")
project(":keyedProcessFunction_2").projectDir = file("flink-jobs/keyedProcessFunction_2")
project(":processAllWindowFunction").projectDir = file("flink-jobs/processAllWindowFunction")
project(":aggregate").projectDir = file("flink-jobs/aggregate")
project(":inactivity-alert").projectDir = file("flink-jobs/inactivity-alert")